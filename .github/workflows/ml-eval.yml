name: ML Evaluation Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/ml/**'
      - 'ml/**'
      - 'evaluate.py'
      - 'generate_test_data.py'
      - 'backend/requirements.txt'
      - 'requirements_ml.txt'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/ml/**'
      - 'ml/**'
      - 'evaluate.py'
      - 'generate_test_data.py'
      - 'backend/requirements.txt'
      - 'requirements_ml.txt'

jobs:
  evaluate-models:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # requirements_ml.txt carries the plotting deps evaluate.py needs
        # (matplotlib, seaborn) that the service requirements deliberately omit.
        pip install -r backend/requirements.txt -r requirements_ml.txt

    - name: Run Model Evaluation
      env:
        # Require these secrets to be set in the repository settings to allow Supabase reads
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      run: |
        # Generate the synthetic dataset first: data/ecopulse.db is no longer
        # committed (it held user data), so CI builds it from scratch.
        python generate_test_data.py
        python evaluate.py

    - name: Upload Evaluation Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ml-evaluation-results
        path: |
          evaluation_results/
          models/
        retention-days: 14
